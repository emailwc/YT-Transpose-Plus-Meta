
plugins { id 'com.android.application' }
android {
    namespace 'com.emailwc.ytkeyplayerexact'
    compileSdk 34
    defaultConfig {
        applicationId "com.emailwc.ytkeyplayerexact"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "14.0-OptionA-Animated"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {}
